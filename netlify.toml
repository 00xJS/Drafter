[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Function proxies first, then the SPA fallback
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

[[redirects]]
  from = "/api/calendars"
  to = "/.netlify/functions/calendars"
  status = 200

[[redirects]]
  from = "/api/feed.ics"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
