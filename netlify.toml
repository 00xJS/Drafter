[build]
  command = "npm run check"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Function proxies first, then the SPA fallback
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

[[redirects]]
  from = "/api/calendars"
  to = "/.netlify/functions/calendars"
  status = 200

[[redirects]]
  from = "/api/feed.ics"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/household"
  to = "/.netlify/functions/household"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/inbound"
  to = "/.netlify/functions/inbound"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/api/microsoft"
  to = "/.netlify/functions/microsoft"
  status = 200

[[redirects]]
  from = "/api/microsoft/*"
  to = "/.netlify/functions/microsoft/:splat"
  status = 200

[[redirects]]
  from = "/api/google"
  to = "/.netlify/functions/google"
  status = 200

[[redirects]]
  from = "/api/google/*"
  to = "/.netlify/functions/google/:splat"
  status = 200

# Assistants: the hosted MCP endpoint, its connections, and the OAuth server
# claude.ai and other MCP clients connect through. /oauth/authorize is left to
# the SPA on purpose: consent happens inside the signed-in app.
[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/agents"
  to = "/.netlify/functions/agents"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth/prm"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth/prm"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth/as"
  status = 200

[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "/.netlify/functions/oauth/as"
  status = 200

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/oauth/register"
  status = 200

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/oauth/token"
  status = 200

[[redirects]]
  from = "/oauth/revoke"
  to = "/.netlify/functions/oauth/revoke"
  status = 200

[[redirects]]
  from = "/api/oauth/*"
  to = "/.netlify/functions/oauth/app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# No page of this site may be framed: the consent sheet grants an assistant
# access to the planner, and a framed copy of it could be clickjacked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

# The app page, the service worker and the build stamp are re-checked on every
# load, so a deploy reaches an open app the next time it looks
# (src/appupdate.ts); the hashed files under /assets never change.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw-push.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
