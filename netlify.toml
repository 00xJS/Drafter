[build]
  command = "npm run check"
  publish = "dist"

  [build.environment]
    # Netlify's secrets scanner fails a build when the value of an environment
    # variable turns up in what was published. APPLE_TEAM_ID does, on purpose:
    # it is half of the appID in /.well-known/apple-app-site-association, which
    # only works by being fetched by Apple over the open internet.
    #
    # It is not a secret and cannot be one. The same ten characters are in the
    # code signature of every build of the app — `codesign -dv` prints them
    # from any copy — and in the association file of every site that supports
    # Universal Links. It identifies a developer account; it authorises
    # nothing on its own.
    SECRETS_SCAN_OMIT_KEYS = "APPLE_TEAM_ID"

[functions]
  node_bundler = "esbuild"

# Function proxies first, then the SPA fallback
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/recipe-import"
  to = "/.netlify/functions/recipe-import"
  status = 200

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

[[redirects]]
  from = "/api/calendars"
  to = "/.netlify/functions/calendars"
  status = 200

[[redirects]]
  from = "/api/feed.ics"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/household"
  to = "/.netlify/functions/household"
  status = 200

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

# what broke on a device, for the site owner (Admin → Data)
[[redirects]]
  from = "/api/log"
  to = "/.netlify/functions/log"
  status = 200

[[redirects]]
  from = "/api/inbound"
  to = "/.netlify/functions/inbound"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

# telling the other member about a task you share (the hub's notices)
[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from = "/api/microsoft"
  to = "/.netlify/functions/microsoft"
  status = 200

[[redirects]]
  from = "/api/microsoft/*"
  to = "/.netlify/functions/microsoft/:splat"
  status = 200

[[redirects]]
  from = "/api/google"
  to = "/.netlify/functions/google"
  status = 200

[[redirects]]
  from = "/api/google/*"
  to = "/.netlify/functions/google/:splat"
  status = 200

# Assistants: the hosted MCP endpoint, its connections, and the OAuth server
# claude.ai and other MCP clients connect through. /oauth/authorize is left to
# the SPA on purpose: consent happens inside the signed-in app.
[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/agents"
  to = "/.netlify/functions/agents"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth/prm"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth/prm"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth/as"
  status = 200

[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "/.netlify/functions/oauth/as"
  status = 200

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/oauth/register"
  status = 200

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/oauth/token"
  status = 200

[[redirects]]
  from = "/oauth/revoke"
  to = "/.netlify/functions/oauth/revoke"
  status = 200

[[redirects]]
  from = "/api/oauth/*"
  to = "/.netlify/functions/oauth/app/:splat"
  status = 200

# A file under /assets that the build does not have is a 404, never the app
# page. Existing files are still served as always: without `force` a rule
# only answers what no file matches. The build has no 404.html, so Netlify
# answers with its own not-found page. An old page asking for a chunk that a
# later deploy removed then gets a load error (and the app reloads onto the
# new build), not HTML where it expected a script. A worker precaching the
# build fails its install instead of storing the page under a script's name.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# The garment cut-out's files: a missing one must 404, never come back as the app page
[[redirects]]
  from = "/cutout/*"
  to = "/cutout/not-found"
  status = 404

# Apple's association file, by the same rule, and for a sharper reason. It is
# written only when APPLE_TEAM_ID is set (vite.config.ts); without it the
# catch-all below served the APP PAGE here, and the header rule then labelled
# that HTML application/json — so Apple fetched a valid-looking document that
# was not the association, and cached the failure. A 404 is the honest answer.
# Netlify serves a real file ahead of an unforced redirect, so once the file
# exists this rule never fires.
[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# No page of this site may be framed: the consent sheet grants an assistant
# access to the planner, and a framed copy of it could be clickjacked.
#
# The rest of the Content-Security-Policy — where scripts, styles, images and
# connections may come from — is not here: the build writes it into
# dist/_headers (vite.config.ts, from shared/csp.mts), because it names the
# Supabase project the build talks to and hashes index.html's inline script.
# Netlify applies both. That one is Report-Only until CSP_ENFORCE is set on
# the host (README → Deploy); this line is enforced either way.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

# The app page, the service worker and the build stamp are re-checked on every
# load, so a deploy reaches an open app the next time it looks
# (src/appupdate.ts); the hashed files under /assets never change.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Apple fetches this exact path, with no extension, and will not read it unless
# it is served as JSON. It is written at build time from APPLE_TEAM_ID
# (vite.config.ts); with that variable unset no file exists and this rule is a
# no-op. iOS caches what it fetches, so a change here can take a reinstall to
# be seen.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw-push.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Versioned folders (magic-touch-v1, mediapipe-<version>); their contents never change
[[headers]]
  for = "/cutout/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
