# Weekly update pull requests: npm, and the actions the workflows pin by commit.
# Each runs CI like any other pull request; nothing merges on its own.
#
# Dependabot files an update under its most specific matching group, not the
# first one listed, and a group with update-types outranks one without: the
# first run put Capacitor in minor-and-patch. So minor-and-patch excludes every
# package that has a group of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # a release gets a week to be found out before it is offered
    cooldown:
      default-days: 7
    # held on purpose, each until what its line names changes
    ignore:
      # Node is pinned to 22 (.nvmrc, engines): its types follow the runtime
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Babel 8 leaves 66 components uncompiled by the React Compiler: default
      # props fail as an AssignmentPattern (DEVELOPMENT.md, 2026-09-23)
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript below 6.1
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
    groups:
      # Capacitor and its plugins come on their own: a bump changes the iOS
      # Swift packages, patch-package pins two of them (patches/), and only a
      # phone build proves one.
      capacitor:
        patterns:
          - '@capacitor/*'
          - '@aparajita/capacitor-*'
      # packages that name each other as peers come together, majors included:
      # alone, @vitejs/plugin-react 6 cannot install beside Vite 7, nor
      # @eslint/js 10 beside ESLint 9 (npm ERESOLVE on the first run). The
      # React Compiler's Babel plugins are the React plugin's peers too.
      build-tools:
        patterns:
          - 'vite'
          - 'vite-plugin-*'
          - '@vitejs/*'
          - 'vitest'
          - '@vitest/*'
          - '@rolldown/*'
          - '@babel/core'
          - 'babel-plugin-react-compiler'
      lint-and-types:
        patterns:
          - 'eslint'
          - 'eslint-plugin-*'
          - '@eslint/*'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      # everything else within its major, in one pull request; a major comes
      # alone, and so does the Anthropic SDK, still 0.x, where a minor can break
      # and only a live call (Admin → Test AI) proves one
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@anthropic-ai/sdk'
          - '@capacitor/*'
          - '@aparajita/capacitor-*'
          - 'vite'
          - 'vite-plugin-*'
          - '@vitejs/*'
          - 'vitest'
          - '@vitest/*'
          - '@rolldown/*'
          - '@babel/core'
          - 'babel-plugin-react-compiler'
          - 'eslint'
          - 'eslint-plugin-*'
          - '@eslint/*'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # the pinned actions in one pull request a week
    groups:
      actions:
        patterns:
          - '*'
