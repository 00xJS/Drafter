# Apply the pending migrations to production, then redeploy the bot. Only on
# purpose: run it from the Actions tab (Deploy database → Run workflow) and
# type the word apply.
#
# The steps the owner runs at the Mac, in the open: link the project, print
# the migrations and the dry run so the log shows what is about to change,
# push, then deploy the bot — a migration that changes what is personal needs
# the bot's copy of that list to follow it.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   the database password (Project Settings → Database)
#   SUPABASE_PROJECT_REF   the project's ref, the first part of its supabase.co address
# A missing one stops the run before anything is touched.
name: Deploy database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type apply to push every pending migration to production'
        required: true
        type: string

permissions:
  contents: read

# never two at once, and never one cancelled half-way
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # read by `supabase link` and `supabase db push` from the environment, never passed as an argument
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Refuse without the word
        run: |
          if [ "$CONFIRM" != "apply" ]; then
            echo "::error title=Nothing applied::Type apply, exactly, to push the migrations. Nothing was changed."
            exit 1
          fi

      - name: Check the secrets are set
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Secrets missing::Set$missing as repository secrets. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v5

      # pinned: the version the owner's Mac pushes with
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations, here and on the server
        run: supabase migration list --linked

      - name: What would change (dry run)
        run: supabase db push --linked --dry-run

      - name: Apply
        run: supabase db push --linked --yes

      - name: Deploy the bot
        run: supabase functions deploy bot --use-api --project-ref "$SUPABASE_PROJECT_REF"
