# Deploy the bot gateway (supabase/functions/bot) whenever main changes it, or
# changes shared/kinds.mjs, whose personal kinds the bot keeps its own copy of
# (mcp.test.ts holds the two equal). Deployed by hand, the bot could lag the
# app, and a bot on an old list can hand a household member's new personal
# kind to an automation.
#
# The same command the owner runs at the Mac. It needs two repository secrets
# (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   the project's ref, the first part of its supabase.co address
# Without them the run says so and passes: nothing is deployed, nothing is red.
name: Deploy bot

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'shared/kinds.mjs'
  # the same deploy on demand, from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a second waits rather than cancelling one half done
concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice title=Bot not deployed::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are not both set as repository secrets, so the bot was left as it is. Deploy it by hand with: supabase functions deploy bot --use-api"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      # pinned: the version the owner's Mac deploys with, so both deploy the same way
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.109.0

      # --use-api bundles on Supabase's side, so no Docker is needed here
      - name: Deploy the bot
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy bot --use-api --project-ref "$SUPABASE_PROJECT_REF"
