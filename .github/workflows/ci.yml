# Every push and pull request: lint, then `npm run check` (what Netlify runs
# before a deploy), then the two database smoke tests Netlify cannot run
# because it has no Postgres. scripts/lib/pgtest.sh boots its own throwaway
# cluster from the binaries on PATH, so there is no service container. Once
# all that has passed, the browser tests, in a job of their own, and the cloud
# lane's against a local Supabase stack, in another. On main, once every job
# the deploy job needs has passed: the site's deploy, when the owner has
# switched gated deploys on (the deploy job, below), and the bot's
# (deploy-bot.yml follows this workflow).
#
# The repository is public, so every action below is pinned to a commit, not
# a tag: a tag can be moved to other code, a commit cannot. The version is in
# the comment beside it, and Dependabot (.github/dependabot.yml) moves both.
# No step pushes, so no checkout keeps the token in .git/config.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .nvmrc: the line Netlify builds with too (package.json engines: >=22.18)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A step of its own so a lint failure is named as one; `check` runs it
      # again because Netlify only runs `check`.
      - run: npm run lint

      # lint + vitest + tsc + vite build. The build reads the two Supabase
      # settings, and without them leaves the Supabase client out (local mode),
      # so its precache measured about 220 KiB under the one production ships.
      # Placeholders build the real bundle; nothing is ever asked of them, and
      # the unit tests never see them (src/__tests__/setup.ts clears both).
      - run: npm run check
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      # Supabase runs Postgres 17 (supabase/config.toml) and so does local
      # development, so the migrations are applied to 17 here too, from the
      # PGDG apt repo. Only the binaries are wanted: pgtest.sh makes its own
      # cluster, so the package is told not to create and start a main one.
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      # No port variables: each smoke test picks a free port for its server.
      - run: npm run db:smoke

      - run: npm run mcp:smoke

  # The bot gateway (supabase/functions/bot) is Deno, so neither tsc nor ESLint
  # reads it: Deno type-checks and lints it here, against the exact supabase-js
  # its import pins. No node_modules in this job, so Deno is told not to look
  # for one beside the repository's package.json, and to write no lockfile.
  # no-import-prefix asks for an import map: the bot deploys as one file with
  # its jsr: import inline, and a deno.json beside it would change the deploy.
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - run: deno check --no-lock --node-modules-dir=none supabase/functions/bot/index.ts

      - run: deno lint --rules-exclude=no-import-prefix supabase/functions/bot

  # The browser tests (npm run e2e): Playwright drives a local-mode build of the
  # app in WebKit, as an iPhone with the iOS look, and in Chromium, as a desktop.
  # Not part of `check`, which Netlify runs and which has no browsers; here, once
  # check has passed. A failure keeps the HTML report, traces included.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # the two browsers the projects use, and the system libraries they need
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The cloud lane (npm run e2e:cloud): the app built in cloud mode against a
  # real Supabase stack on the runner — sign-in, the sync_posts round, the
  # last-write-wins trigger and Realtime, two members of one household in two
  # browsers. `supabase start` applies every migration to a fresh database
  # first, and fails here if one does not apply. Netlify's functions are
  # answered in the page (e2e/cloud/api.ts). A failure keeps the HTML report,
  # traces included.
  #
  # Advisory until it has proven itself green: not among the deploy job's
  # needs, and continue-on-error, since deploy-bot.yml deploys only after a
  # CI run that succeeded as a whole. Once it has, drop continue-on-error and
  # add it to the deploy job's needs, together.
  e2e-cloud:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # pinned, as in deploy-db.yml: the version the owner's Mac runs
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.0

      # Only what the lane talks to: Postgres, GoTrue, PostgREST, Realtime,
      # Kong in front of them, and Storage, whose tables the migrations put
      # policies on. No dashboard, image resizing, mail, functions, logs or pooler.
      - name: Start a local Supabase stack
        run: supabase start -x studio -x imgproxy -x mailpit -x edge-runtime -x logflare -x vector -x postgres-meta -x supavisor

      # The four settings e2e/cloud/lane.ts declares, each of which must be
      # there. The legacy JWT keys, which every local service takes, while the
      # CLI prints them; else the new ones (src/supabase.ts and keyHeaders take both).
      - name: Point the lane at it
        run: |
          stack="$(supabase status -o json)"
          put() {
            local value
            value="$(jq -er "$2" <<<"$stack")"
            echo "$1=$value" >> "$GITHUB_ENV"
          }
          put E2E_SUPABASE_URL .API_URL
          put E2E_SUPABASE_ANON_KEY '.ANON_KEY // .PUBLISHABLE_KEY'
          put E2E_SUPABASE_SERVICE_ROLE_KEY '.SERVICE_ROLE_KEY // .SECRET_KEY'
          put E2E_DATABASE_URL .DB_URL

      # the lane writes its households with psql (e2e/cloud/stack.ts); the runner image has a client
      - run: psql --version || { sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client; }

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e:cloud

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-cloud
          path: playwright-report-cloud/
          retention-days: 14

  # Gated deploys (README → Deploy): once main has passed everything above but
  # the advisory cloud lane, Netlify is asked to build it through the site's
  # build hook. Only while the owner has switched the gate on: the
  # NETLIFY_BUILD_HOOK secret here, and DRAFTER_GATED_DEPLOYS=1 on Netlify,
  # which then skips the build a push starts (scripts/netlify-ignore.mjs).
  # Without the secret this does nothing, and Netlify builds each push to main
  # itself, as before.
  deploy:
    name: Deploy (Netlify build hook)
    needs: [check, bot, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # one at a time; a newer run waits rather than cancelling one
    concurrency:
      group: netlify-deploy
      cancel-in-progress: false
    steps:
      - name: Ask Netlify to build main
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "Gated deploys are off (no NETLIFY_BUILD_HOOK secret): Netlify builds each push to main itself."
            exit 0
          fi
          # A hook builds whatever main is now, not this commit. So only the
          # newest commit asks: an older run finishing late would otherwise put
          # a newer push live before its own tests had passed.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to ${head:0:7}; its own CI run deploys it once it passes."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST -d '{}' "$NETLIFY_BUILD_HOOK?trigger_title=CI+passed+for+${GITHUB_SHA:0:7}"
          echo "Netlify is building main at ${GITHUB_SHA:0:7}."
